<title>Mi Recetario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: cuaderno de cocina — una columna angosta, tarjetas de receta como fichas, medidas resaltadas como etiquetas */
:root {
  --bg: #f2f4ee;
  --surface: #ffffff;
  --ink: #23291f;
  --muted: #5f6a58;
  --line: #d7ddcf;
  --herb: #3d6b35;
  --herb-soft: #e3ecdc;
  --saffron: #b7790f;
  --saffron-soft: #f8ecd2;
  --danger: #a33a2a;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a14; --surface: #20261d; --ink: #e9eee3; --muted: #a3ae9a; --line: #353f30;
    --herb: #8fc47f; --herb-soft: #2a3a25; --saffron: #e6b04a; --saffron-soft: #3b2f17; --danger: #e48a79;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a14; --surface: #20261d; --ink: #e9eee3; --muted: #a3ae9a; --line: #353f30;
  --herb: #8fc47f; --herb-soft: #2a3a25; --saffron: #e6b04a; --saffron-soft: #3b2f17; --danger: #e48a79;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
p { margin: 0; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header.top .sub { color: var(--muted); font-size: 0.95rem; }
nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
button, .btn {
  font: inherit; font-weight: 700; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink); padding: 9px 14px; cursor: pointer;
}
button:focus-visible, input:focus-visible, textarea:focus-visible, .card:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
button.primary { background: var(--herb); border-color: var(--herb); color: var(--bg); }
button.ghost { background: transparent; }
button.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
button[aria-pressed="true"] { background: var(--herb-soft); border-color: var(--herb); color: var(--ink); }
button:disabled { opacity: 0.55; cursor: progress; }
input[type="search"], input[type="text"], textarea {
  font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink);
}
textarea { min-height: 150px; resize: vertical; }
label.lbl { font-weight: 700; display: block; margin-bottom: 6px; }
.hint { color: var(--muted); font-size: 0.9rem; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.list { display: grid; gap: 10px; }
.card {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px;
  display: grid; gap: 4px; cursor: pointer; text-align: left; font-weight: 400; width: 100%;
}
.card:hover { border-color: var(--herb); }
.card .t { font-family: var(--display); font-weight: 600; font-size: 1.15rem; }
.card .m { color: var(--muted); font-size: 0.9rem; }
.tag { display: inline-block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--saffron-soft); color: var(--saffron); }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; border: 1.5px dashed var(--line); border-radius: 14px; }
ul.ing { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
ul.ing li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
ul.ing li:last-child { border-bottom: 0; }
.qty { font-weight: 700; color: var(--herb); font-variant-numeric: tabular-nums; }
.orig { color: var(--muted); font-size: 0.85rem; }
.swap { font-size: 0.85rem; color: var(--saffron); font-weight: 700; }
ol.steps { margin: 0; padding-left: 1.4rem; display: grid; gap: 10px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button { padding: 6px 12px; border-radius: 999px; font-weight: 400; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1.5px solid var(--line); }
.notice { padding: 10px 14px; border-radius: 10px; background: var(--saffron-soft); color: var(--ink); font-size: 0.95rem; }
.notice.err { background: transparent; border: 1.5px solid var(--danger); color: var(--danger); }
.working { color: var(--muted); font-style: italic; white-space: pre-wrap; max-height: 160px; overflow: auto; font-size: 0.85rem; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; }
.filtros button { padding: 5px 12px; border-radius: 999px; font-weight: 400; font-size: 0.9rem; }
.who { display: inline-block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--herb-soft); color: var(--herb); }
ul.ing li.grupo { display: block; font-weight: 700; color: var(--saffron); font-size: 0.9rem; padding-top: 14px; }
.ed-row { display: grid; grid-template-columns: 5rem 8rem 1fr auto; gap: 6px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ed-row .ed-extra { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ed-row input { padding: 7px 9px; font-size: 0.95rem; min-width: 0; }
.ed-row button { padding: 6px 10px; }
.ed-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) {
  ul.ing li { grid-template-columns: 6rem 1fr; } h1 { font-size: 1.7rem; }
  .ed-row { grid-template-columns: 4.5rem 1fr auto; }
  .ed-row .ed-ing { grid-column: 1 / -1; grid-row: 2; }
  .ed-two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Mi Recetario</h1>
      <p class="sub">Tus recetas, en tazas y cucharadas.</p>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <button id="tab-lista" data-view="lista">Recetas</button>
      <button id="tab-nueva" data-view="nueva" class="primary">+ Nueva</button>
      <button id="tab-ajustes" data-view="ajustes">Mis medidas</button>
    </nav>
  </header>
  <div id="status" hidden></div>
  <main id="main" class="stack"></main>
</div>

<script>
(() => {
  const DEFAULT_PREFS = {
    medidas: ["taza", "cucharada", "cucharadita", "unidad", "pizca", "°C"],
    notas: "Taza de 240 ml. Prefiero fracciones simples (1/2, 1/3, 1/4)."
  };
  const TODAS_MEDIDAS = ["taza", "cucharada", "cucharadita", "unidad", "pizca", "gramos", "ml", "°C", "°F"];

  const S = {
    view: "lista", recetas: [], cargando: true, sinConexion: false, db: null, sample: null, imgLimits: null,
    prefs: { ...DEFAULT_PREFS }, buscar: "", abierta: null, borrador: null, editId: null,
    texto: "", pedido: "", fotos: [], trabajando: false, progreso: "", error: "", confirmarBorrar: false, cambio: ""
  };
  const $main = document.getElementById("main");
  const $status = document.getElementById("status");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function go(view) { S.view = view; S.error = ""; S.confirmarBorrar = false; render(); window.scrollTo(0, 0); }
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.view === "nueva") { S.borrador = null; S.editId = null; S.texto = ""; S.pedido = ""; S.fotos = []; }
    go(b.dataset.view);
  }));

  function setStatus(msg, err) {
    $status.hidden = !msg; $status.className = "notice" + (err ? " err" : ""); $status.textContent = msg || "";
  }

  /* ---------- prompts ---------- */
  function reglas() {
    return `Medidas que usa la persona: ${S.prefs.medidas.join(", ")}.
Preferencias: ${S.prefs.notas || "(ninguna)"}
Reglas de conversión:
- Pasá cada cantidad a las medidas de la persona. Equivalencias: 1 taza = 240 ml, 1 cucharada = 15 ml, 1 cucharadita = 5 ml.
- Gramos a taza según el ingrediente (aprox.): harina 125 g, azúcar 200 g, azúcar impalpable 120 g, azúcar mascabo 220 g, manteca 225 g, cacao 90 g, avena 90 g, arroz 190 g, leche/agua 240 g, aceite 220 g, miel 340 g, nueces picadas 120 g, queso rallado 100 g. Para otros, estimá con criterio.
- Cantidades chicas (menos de 1/4 taza) en cucharadas o cucharaditas.
- Usá fracciones simples: 1/4, 1/3, 1/2, 2/3, 3/4, y combinaciones como "1 1/2".
- Lo que se cuenta (huevos, dientes de ajo, cebollas) queda en "unidad". "A gusto" se mantiene.
- Temperaturas y tiempos de horno en la unidad de temperatura de la persona, en los pasos.
- En "original" poné la cantidad como venía (ej. "250 g"), o "" si no cambió.
- Escribí en español rioplatense, claro y corto.`;
  }
  const FORMA = `Respondé SOLO con JSON, con esta forma exacta:
{"titulo": string, "para": string, "momento": string, "porciones": string, "tiempo": string,
 "ingredientes": [{"cantidad": string, "unidad": string, "ingrediente": string, "original": string, "reemplaza": string, "nota": string, "grupo": string}],
 "pasos": [string], "notas": string}
"para" es para quién es la receta si se sabe (ej. "Sofi"), "momento" cuándo se come (ej. "Desayuno"). "reemplaza" es el ingrediente original si este es un reemplazo pedido, si no "". "nota" es opcional (ej. "aprox."). "grupo" es la sección del ingrediente si la receta tiene partes (ej. "Cobertura"), si no "". Si falta un dato usá "".`;

  async function convertir() {
    if (!S.sample) return;
    if (!S.texto.trim() && !S.fotos.length) { S.error = "Pegá el texto de la receta o subí una foto."; render(); return; }
    S.trabajando = true; S.error = ""; S.progreso = ""; render();
    const prompt = `Sos un asistente de cocina. Te paso una receta ${S.fotos.length ? "en foto(s)" : ""}${S.fotos.length && S.texto.trim() ? " y en texto" : ""}. Leela entera y pasala a las medidas de la persona.
${reglas()}
Reemplazos o cambios que pide la persona: ${S.pedido.trim() || "(ninguno)"}
Si pide reemplazar algo, ajustá cantidades y pasos para que la receta siga funcionando.
${S.texto.trim() ? "Receta en texto:\n" + S.texto.trim() : ""}
${FORMA}`;
    try {
      const opts = { modelTier: "default" };
      if (S.fotos.length) opts.images = S.fotos.map(f => f.file);
      const r = await S.sample.json(prompt, opts);
      S.borrador = limpiar(r); S.editId = null;
    } catch (e) { S.error = mensajeError(e); }
    S.trabajando = false; render();
  }

  async function cambiarIngredientes() {
    const rec = S.recetas.find(r => r.id === S.abierta);
    if (!rec || !S.cambio.trim() || !S.sample) return;
    S.trabajando = true; S.error = ""; render();
    const { id, creada, actualizada, ...cuerpo } = rec;
    const prompt = `Sos un asistente de cocina. Esta es una receta guardada (JSON):
${JSON.stringify(cuerpo)}
La persona pide este cambio: ${S.cambio.trim()}
Aplicá el cambio, ajustá cantidades y pasos para que la receta siga funcionando, y mantené todo lo demás igual.
${reglas()}
${FORMA}`;
    try {
      S.borrador = limpiar(await S.sample.json(prompt, { modelTier: "default" }));
      S.editId = rec.id; S.cambio = ""; S.view = "nueva";
    } catch (e) { S.error = mensajeError(e); }
    S.trabajando = false; render();
  }

  function limpiar(r) {
    const str = v => (typeof v === "string" ? v : v == null ? "" : String(v));
    return {
      titulo: str(r?.titulo) || "Receta sin nombre", para: str(r?.para), momento: str(r?.momento),
      porciones: str(r?.porciones), tiempo: str(r?.tiempo),
      ingredientes: (Array.isArray(r?.ingredientes) ? r.ingredientes : []).map(i => ({
        cantidad: str(i?.cantidad), unidad: str(i?.unidad), ingrediente: str(i?.ingrediente),
        original: str(i?.original), reemplaza: str(i?.reemplaza), nota: str(i?.nota), grupo: str(i?.grupo)
      })),
      pasos: (Array.isArray(r?.pasos) ? r.pasos : []).map(str).filter(Boolean),
      notas: str(r?.notas)
    };
  }
  function mensajeError(e) {
    const c = e?.code;
    if (c === "not_granted") return "Para convertir recetas tenés que permitir que la página use Claude. Podés activarlo desde el menú Permisos del artifact.";
    if (c === "rate_limited") return "Claude está ocupado. Esperá un minuto y probá de nuevo.";
    if (c === "image_rejected") return "No pude leer esa foto. Probá con una imagen JPG o PNG más chica.";
    if (c === "images_unavailable") return "En esta vista no se pueden mandar fotos. Pegá la receta como texto.";
    return "No pude convertir la receta (" + (e?.message || "error desconocido") + "). Probá de nuevo.";
  }

  /* ---------- recetas parecidas ---------- */
  const STOP = new Set("de del la el los las en con sin y o a al para por un una unos unas mas muy bien fina fino finita procesada procesado opcional gusto chorrito pizca generosa generoso madura maduro cocido cocida picado picada rallado rallada hervida hervidas hervido duros duras arriba poco tibia relleno express rapido rapidas receta".split(" "));
  const BASICOS = new Set(["huevo", "sal", "aceite", "agua", "edulcorante", "vainilla", "pimienta", "clara"]);
  const normTxt = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\(.*?\)/g, " ").replace(/[^a-z\s]/g, " ");
  const raiz = w => w.length > 4 && w.endsWith("es") ? w.slice(0, -2) : w.length > 3 && w.endsWith("s") ? w.slice(0, -1) : w;
  const palabras = s => normTxt(s).split(/\s+/).filter(w => w.length > 2 && !STOP.has(w)).map(raiz);
  const claves = r => new Set((r.ingredientes || []).map(i => palabras(i.ingrediente)[0]).filter(k => k && !BASICOS.has(k)));
  const jaccard = (a, b) => { if (!a.size || !b.size) return 0; let n = 0; a.forEach(x => b.has(x) && n++); return n / (a.size + b.size - n); };
  function parecidas(nueva, excluirId) {
    const tn = new Set(palabras(nueva.titulo)), cn = claves(nueva);
    return S.recetas.filter(r => r.id !== excluirId).map(r => {
      const cr = claves(r);
      const score = Math.max(jaccard(tn, new Set(palabras(r.titulo))), cn.size >= 2 && cr.size >= 2 ? jaccard(cn, cr) : 0);
      return { r, score };
    }).filter(x => x.score >= 0.6).sort((a, b) => b.score - a.score).slice(0, 3);
  }
  function avisoParecidas(lista, titulo) {
    if (!lista.length) return "";
    return `<div class="notice stack" style="gap:8px" role="status">
      <b>${titulo || `Ojo: ya tenés ${lista.length === 1 ? "una receta parecida" : "recetas parecidas"}.`}</b>
      ${lista.map(({ r, score }) => `<div class="row" style="justify-content:space-between;gap:8px">
        <span><b>${esc(r.titulo)}</b>${r.para ? ` <span class="hint">· para ${esc(r.para)}</span>` : ""} <span class="hint">· ${score >= 0.8 ? "casi igual" : "parecida"}</span></span>
        <span class="row" style="gap:6px">
          <button class="ghost" data-ver="${esc(r.id)}" aria-pressed="${S.verParecida === r.id}">${S.verParecida === r.id ? "Ocultar" : "Ver"}</button>
          ${S.sample ? `<button data-combinar="${esc(r.id)}" ${S.trabajando ? "disabled" : ""}>${S.trabajando ? "Combinando…" : "Combinar"}</button>` : ""}
        </span>
      </div>${S.verParecida === r.id ? vistaReceta(r) : ""}`).join("")}
    </div>`;
  }
  // base: la receta que estás viendo; alGuardarBorrar: si base ya está guardada, la otra se borra al combinar
  function conectarParecidas(base, baseGuardadaId) {
    $main.querySelectorAll("[data-ver]").forEach(b => b.addEventListener("click", () => {
      S.verParecida = S.verParecida === b.dataset.ver ? null : b.dataset.ver; render();
    }));
    $main.querySelectorAll("[data-combinar]").forEach(b => b.addEventListener("click", () => {
      const otra = S.recetas.find(r => r.id === b.dataset.combinar);
      if (!otra) return;
      if (baseGuardadaId) combinar(base, otra, baseGuardadaId, otra.id);
      else combinar(base, otra, otra.id, null);
    }));
  }
  async function combinar(a, b, destinoId, borrarId) {
    if (!S.sample) return;
    S.trabajando = true; S.error = ""; render();
    const sinMeta = ({ id, creada, actualizada, ejemplo, ...x }) => x;
    const prompt = `Sos un asistente de cocina. Estas son dos versiones de la misma receta (o muy parecidas). Combinálas en UNA sola receta.
Versión A: ${JSON.stringify(sinMeta(limpiar(a)))}
Versión B: ${JSON.stringify(sinMeta(limpiar(b)))}
Reglas para combinar:
- Elegí el nombre más claro. Mantené "para" y "momento" (si difieren, unilos, ej. "Desayuno / merienda").
- Usá la versión más completa como base. Si una cantidad o un paso difiere entre versiones, dejá la de la base y anotá la otra como alternativa en "nota" del ingrediente o en "notas" (ej. "Variante: con 2 cucharadas de chía").
- No pierdas información útil de ninguna de las dos (tips, conservación, variantes).
- Mantené las medidas como están, no las conviertas de nuevo.
- Escribí en español rioplatense, claro y corto.
${FORMA}`;
    try {
      S.borrador = limpiar(await S.sample.json(prompt, { modelTier: "default" }));
      S.editId = destinoId; S.borrarTrasGuardar = borrarId;
      S.combinando = { destino: S.recetas.find(r => r.id === destinoId)?.titulo || "", borrar: S.recetas.find(r => r.id === borrarId)?.titulo || "" };
      S.ed = null; S.verParecida = null; S.view = "nueva";
    } catch (e) { S.error = mensajeError(e).replace("convertir la receta", "combinar las recetas"); }
    S.trabajando = false; render(); window.scrollTo(0, 0);
  }

  /* ---------- guardar ---------- */
  async function guardarDatos(datos, id) {
    if (!S.db || !datos) return false;
    S.trabajando = true; S.error = ""; render();
    const ahora = new Date().toISOString();
    const limpio = limpiar(datos);
    let ok = false;
    try {
      if (id) {
        await S.db.doc("recetas/" + id).update({ ...limpio, actualizada: ahora });
        S.abierta = id;
      } else {
        const ref = await S.db.collection("recetas").add({ ...limpio, creada: ahora, actualizada: ahora });
        S.abierta = ref.id;
      }
      ok = true; setStatus("Receta guardada.");
      setTimeout(() => setStatus(""), 2500);
    } catch (e) { S.error = "No pude guardar: " + (e?.message || e?.code || "error"); }
    S.trabajando = false;
    return ok;
  }
  async function guardar() {
    if (await guardarDatos(S.borrador, S.editId)) {
      if (S.borrarTrasGuardar && S.borrarTrasGuardar !== S.editId) {
        try { await S.db.doc("recetas/" + S.borrarTrasGuardar).delete(); setStatus("Recetas combinadas en una sola."); setTimeout(() => setStatus(""), 2500); }
        catch (e) { S.error = "Guardé la receta combinada, pero no pude borrar la otra. Borrala a mano."; }
      }
      S.borrador = null; S.editId = null; S.borrarTrasGuardar = null; S.combinando = null;
      S.texto = ""; S.pedido = ""; S.fotos = [];
      S.view = "receta";
    }
    render();
  }
  function abrirEditor(datos, id) {
    const d = limpiar(JSON.parse(JSON.stringify(datos)));
    if (!d.ingredientes.length) d.ingredientes.push(limpiar({ ingredientes: [{}] }).ingredientes[0]);
    S.ed = { id: id || null, d, pasosTexto: d.pasos.join("\n") };
    go("editar");
  }
  async function guardarEditor() {
    const d = S.ed.d;
    d.pasos = S.ed.pasosTexto.split("\n").map(s => s.trim()).filter(Boolean);
    d.ingredientes = d.ingredientes.filter(i => i.ingrediente.trim() || i.cantidad.trim());
    if (!d.titulo.trim()) { S.error = "Ponele un nombre a la receta."; render(); return; }
    if (!S.ed.id && !S.ed.confirmado) {
      const sim = parecidas(d, null);
      if (sim.length) { S.ed.aviso = sim; render(); return; }
    }
    if (await guardarDatos(d, S.ed.id)) {
      if (S.borrador) { S.borrador = null; S.editId = null; S.texto = ""; S.pedido = ""; S.fotos = []; }
      S.ed = null; S.view = "receta";
    }
    render();
  }
  async function borrar(id) {
    try { await S.db.doc("recetas/" + id).delete(); S.abierta = null; go("lista"); }
    catch (e) { S.error = "No pude borrar: " + (e?.message || "error"); render(); }
  }
  async function guardarPrefs() {
    if (!S.db) return;
    try { await S.db.doc("ajustes/prefs").set({ medidas: S.prefs.medidas, notas: S.prefs.notas }); setStatus("Medidas guardadas."); setTimeout(() => setStatus(""), 2500); }
    catch (e) { setStatus("No pude guardar tus medidas: " + (e?.message || "error"), true); }
  }

  /* ---------- vistas ---------- */
  function vistaReceta(r, extra = "") {
    const meta = [r.porciones && "Rinde " + r.porciones, r.tiempo].filter(Boolean).map(esc).join(" · ");
    const chips = [r.para && `<span class="who">${esc(r.para)}</span>`, r.momento && `<span class="tag">${esc(r.momento)}</span>`].filter(Boolean).join(" ");
    let grupoActual = "";
    const cabecera = i => {
      if ((i.grupo || "") === grupoActual) return "";
      grupoActual = i.grupo || "";
      return grupoActual ? `<li class="grupo">${esc(grupoActual)}</li>` : "";
    };
    return `<article class="panel">
      <div class="stack" style="gap:6px"><h2>${esc(r.titulo)}</h2>${chips ? `<div class="row" style="gap:6px">${chips}</div>` : ""}${meta ? `<p class="hint">${meta}</p>` : ""}</div>
      ${r.ingredientes.length ? `<div class="stack" style="gap:6px"><h3>Ingredientes</h3>
        <ul class="ing">${r.ingredientes.map(i => `${cabecera(i)}<li>
          <span class="qty">${esc([i.cantidad, i.unidad].filter(Boolean).join(" ")) || "—"}</span>
          <span>${esc(i.ingrediente)}${i.nota ? ` <span class="orig">(${esc(i.nota)})</span>` : ""}
            ${i.reemplaza ? `<br><span class="swap">↺ en lugar de ${esc(i.reemplaza)}</span>` : ""}
            ${i.original ? `<br><span class="orig">original: ${esc(i.original)}</span>` : ""}</span>
        </li>`).join("")}</ul>
      </div>` : ""}
      ${r.pasos.length ? `<div class="stack" style="gap:8px"><h3>Preparación</h3><ol class="steps">${r.pasos.map(p => `<li>${esc(p)}</li>`).join("")}</ol></div>` : ""}
      ${r.notas ? `<div class="stack" style="gap:6px"><h3>Notas</h3><p>${esc(r.notas)}</p></div>` : ""}
      ${extra}
    </article>`;
  }

        document.getElementById("btn-ed-borrador").addEventListener("click", () => abrirEditor(S.borrador, S.editId));
        document.getElementById("btn-descartar").addEventListener("click", () => {
          const volver = S.editId; S.borrador = null; S.editId = null; S.borrarTrasGuardar = null; S.combinando = null;

    if (S.view === "editar") {

        <div class="stack" style="gap:4px">
          <h3>Ingredientes</h3>

          <div>${d.ingredientes.map((i, n) => `<div class="ed-row">
            <input type="text" id="ed-c-${n}" data-i="${n}" data-k="cantidad" value="${esc(i.cantidad)}" placeholder="1/2" aria-label="Cantidad">
            <input type="text" id="ed-u-${n}" data-i="${n}" data-k="unidad" value="${esc(i.unidad)}" placeholder="taza" aria-label="Medida">
            <input type="text" id="ed-n-${n}" class="ed-ing" data-i="${n}" data-k="ingrediente" value="${esc(i.ingrediente)}" placeholder="harina" aria-label="Ingrediente">
            <button class="ghost" data-quitar="${n}" aria-label="Quitar ingrediente">✕</button>
            <div class="ed-extra">

        </div>
        <div><label class="lbl" for="ed-pasos">Preparación</label>
          <textarea id="ed-pasos" placeholder="Un paso por renglón">${esc(S.ed.pasosTexto)}</textarea>

        <div><label class="lbl" for="ed-notas">Notas</label>

      $main.querySelectorAll("[data-f]").forEach(el => el.addEventListener("input", () => d[el.dataset.f] = el.value));
      $main.querySelectorAll("[data-i]").forEach(el => el.addEventListener("input", () => d.ingredientes[+el.dataset.i][el.dataset.k] = el.value));
      document.getElementById("ed-pasos").addEventListener("input", e => S.ed.pasosTexto = e.target.value);
      $main.querySelectorAll("[data-quitar]").forEach(b => b.addEventListener("click", () => { d.ingredientes.splice(+b.dataset.quitar, 1); render(); }));
      document.getElementById("btn-agregar").addEventListener("click", () => {

        render(); document.getElementById("ed-c-" + (d.ingredientes.length - 1))?.focus();
      });
      document.getElementById("btn-ed-guardar").addEventListener("click", () => { if (S.ed.aviso) S.ed.confirmado = true; guardarEditor(); });
      document.getElementById("btn-ed-cancelar").addEventListener("click", () => {
        const id = S.ed.id; S.ed = null;
        if (S.borrador) go("nueva"); else if (id) { S.abierta = id; go("receta"); } else go("lista");
      });

    }

    if (S.view === "ajustes") {
      $main.innerHTML = `${err}<section class="panel">
        <h2>Mis medidas</h2>
        <p class="hint">Elegí las medidas que usás en tu cocina. Las recetas nuevas se van a convertir a estas.</p>
        <div class="chips" role="group" aria-label="Medidas">${TODAS_MEDIDAS.map(m =>
          `<button data-m="${esc(m)}" aria-pressed="${S.prefs.medidas.includes(m)}">${esc(m)}</button>`).join("")}</div>
        <div><label class="lbl" for="notas">Otras preferencias</label>
          <textarea id="notas" style="min-height:90px" placeholder="Ej: mi taza es de 250 ml; el horno lo pongo en mínimo/medio/fuerte">${esc(S.prefs.notas)}</textarea></div>
        <div class="row"><button class="primary" id="btn-prefs" ${S.db ? "" : "disabled"}>Guardar mis medidas</button></div>
      </section>`;
      $main.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
        const m = b.dataset.m, set = new Set(S.prefs.medidas);
        set.has(m) ? set.delete(m) : set.add(m);
        S.prefs.medidas = TODAS_MEDIDAS.filter(x => set.has(x)); S.prefs.notas = document.getElementById("notas").value; render();

  /* ---------- fotos: se achican y se pasan a JPG para que cualquier captura funcione ---------- */
  const leerComoDataURL = blob => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = mal; r.readAsDataURL(blob); });
  const cargarImg = src => new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = src; });
  function tipoReal(file) {
    if (file.type && file.type.startsWith("image/")) return file.type;
    const n = (file.name || "").toLowerCase();
    if (/\.png$/.test(n)) return "image/png";
    if (/\.webp$/.test(n)) return "image/webp";
    if (/\.gif$/.test(n)) return "image/gif";
    return "image/jpeg";
  }
  // Abre la foto de varias formas (cada celular se comporta distinto)
  async function abrirImagen(file) {
    try { if (window.createImageBitmap) { const bm = await createImageBitmap(file); return { src: bm, w: bm.width, h: bm.height }; } } catch {}
    try { const url = await leerComoDataURL(file); const img = await cargarImg(url); return { src: img, w: img.naturalWidth, h: img.naturalHeight, url }; } catch {}
    const u = URL.createObjectURL(file);
    try { const img = await cargarImg(u); return { src: img, w: img.naturalWidth, h: img.naturalHeight }; } catch { return null; } finally { setTimeout(() => URL.revokeObjectURL(u), 1000); }
  }
  async function prepararFoto(file) {
    const tipo = tipoReal(file);
    const original = file.type === tipo ? file : new Blob([file], { type: tipo });
    const abierta = await abrirImagen(file);
    if (abierta && abierta.w && abierta.h) {
      try {
        const k = Math.min(1, 2000 / Math.max(abierta.w, abierta.h));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(abierta.w * k)); c.height = Math.max(1, Math.round(abierta.h * k));
        const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(abierta.src, 0, 0, c.width, c.height);
        const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85));
        if (blob && blob.size) return { file: blob, url: c.toDataURL("image/jpeg", 0.5) };
      } catch {}
    }
    // No se pudo achicar: se manda la foto tal cual
    const maxBytes = S.imgLimits?.maxInputBytes;
    if (maxBytes && original.size > maxBytes) return null;
    let url = abierta?.url || "";
    if (!url) { try { url = await leerComoDataURL(original); } catch {} }
    return { file: original, url };
  }
  async function agregarFotos(archivos) {
    const imgs = archivos.filter(f => f && (!f.type || f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name || "")));
    if (!imgs.length) return;
    const max = S.imgLimits?.maxCount || 5;
    const lugar = Math.max(0, max - S.fotos.length);
    S.cargandoFotos = true; S.error = ""; render();
    const listas = (await Promise.all(imgs.slice(0, lugar).map(prepararFoto)));
    const fallidas = listas.filter(x => !x).length;
    S.fotos.push(...listas.filter(Boolean));
    S.cargandoFotos = false;
    if (fallidas) S.error = fallidas === 1 ? "Una de las fotos es demasiado pesada. Probá recortarla o sacar la captura de nuevo." : `${fallidas} fotos son demasiado pesadas. Probá recortarlas.`;
    else if (imgs.length > lugar) S.error = `Entran hasta ${max} fotos por receta; agregué las primeras.`;
    render();
  }
  document.addEventListener("paste", e => {
    if (S.view !== "nueva" || S.borrador) return;
    const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
    if (files.length) { e.preventDefault(); agregarFotos(files); }
  });

  render();

  /* ---------- conexión con Claude ---------- */
  (async () => {
    const [db, sample] = await Promise.all([claude.use("db"), claude.use("sample")]);
    S.db = db; S.sample = sample;
    if (sample) { try { S.imgLimits = (await sample.limits())?.images || null; } catch { S.imgLimits = null; } }
    if (!db) { S.cargando = false; render(); return; }
    const timer = setTimeout(() => { S.sinConexion = true; render(); }, 10000);
    db.collection("recetas").orderBy("actualizada", "desc").onSnapshot(snap => {
      S.recetas = snap.docs.map(d => ({ id: d.id, ...limpiar(d.data()), ejemplo: !!d.data()?.ejemplo, actualizada: d.data()?.actualizada || "" }));
      if (!snap.metadata.fromCache) { clearTimeout(timer); S.cargando = false; S.sinConexion = false; }
      render();
    }, e => { clearTimeout(timer); S.cargando = false; S.error = "No pude leer tus recetas (" + (e?.message || e?.code) + ")."; render(); });
    db.doc("ajustes/prefs").onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); S.prefs = { medidas: Array.isArray(d.medidas) && d.medidas.length ? d.medidas : DEFAULT_PREFS.medidas, notas: typeof d.notas === "string" ? d.notas : "" }; if (S.view !== "ajustes") render(); }
    }, () => {});
  })();
})();
</script>
